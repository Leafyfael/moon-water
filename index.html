};

function getBucketSection(b) {
  for (const d of (b.domain || [])) { if (DOMAIN_MAP[d]) return DOMAIN_MAP[d]; }
  for (const t of (b.tags   || [])) { if (DOMAIN_MAP[t]) return DOMAIN_MAP[t]; }
  return "drop";
}

const _MS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function cleanText(s) {
  return (s || "").replace(/\[\[([^\]]*)\]\]/g,"$1").replace(/\n{3,}/g,"\n\n").trim();
}

function transformBucket(b, sectionId) {
  const d   = new Date(b.created || Date.now());
  const dn  = d.getDate();
  const day = String(dn).padStart(2,"0");
  const sfx = (Math.floor(dn/10)===1)?"th":(["th","st","nd","rd"][dn%10]||"th");
  const date= `${sfx} ${_MS[d.getMonth()]} ${d.getFullYear()}`;
  const txt = cleanText(b.content);
  const quote = txt.length>80 ? txt.slice(0,80)+"…" : txt;
  const sec = sectionId || getBucketSection(b);
  return {
    id: b.id, day, date,
    title: b.name || b.id,
    en: (b.domain||[]).join(" · ") || (b.tags||[]).slice(0,3).join(" · "),
    quote: quote || (b.tags||[]).join(" · ") || "",
    full: txt || null,
    _loaded: !!b.content,
    cat: sec,
  };
}

function buildMemories(list) {
  const r = {blackbox:[],drop:[],self:[],pen:[],weather:[]};
  for (const b of list) { const s=getBucketSection(b); r[s].push(transformBucket(b,s)); }
  return r;
}

// Moon phase calculator
function getMoonPhase() {
  const d = new Date();
  const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
  const c = Math.floor(365.25 * y);
  const e = Math.floor(30.6 * m);
  const jd = c + e + day - 694039.09;
  const phase = jd / 29.53058867;
  return phase - Math.floor(phase);
}

function getMoonName(p) {
  if (p < 0.03 || p > 0.97) return "New Moon";
  if (p < 0.22) return "Waxing Crescent";
  if (p < 0.28) return "First Quarter";
  if (p < 0.47) return "Waxing Gibbous";
  if (p < 0.53) return "Full Moon";
  if (p < 0.72) return "Waning Gibbous";
  if (p < 0.78) return "Last Quarter";
  return "Waning Crescent";
}

function MoonDisplay({ size = 36 }) {
  const p = getMoonPhase();
  const bright = p < 0.5 ? p * 2 : (1 - p) * 2;
  const name = getMoonName(p);
  const lunarDay = Math.round(p * 29.5);
  
  return (
    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
      <div style={{
        width:size, height:size, borderRadius:"50%", position:"relative",
        background:`radial-gradient(circle at 40% 40%, rgba(242,243,246,${0.2 + bright * 0.8}) 0%, rgba(139,159,187,${0.1 + bright * 0.2}) 100%)`,
        boxShadow:`0 0 ${size * 0.6}px rgba(139,159,187,${bright * 0.15})`,
      }}>
        {/* Shadow overlay for phase */}
        <div style={{
          position:"absolute", inset:0, borderRadius:"50%",
          background: p < 0.5
            ? `linear-gradient(to right, rgba(30,35,50,${0.5 - bright * 0.4}) ${50 - bright * 40}%, transparent 100%)`
            : `linear-gradient(to left, rgba(30,35,50,${0.5 - bright * 0.4}) ${50 - bright * 40}%, transparent 100%)`,
        }} />
      </div>
      <div>
        <div style={{ fontFamily:"'EB Garamond',serif", fontSize:9, color:COLORS.textGhost, letterSpacing:1 }}>{name}</div>
        <div style={{ fontFamily:"'EB Garamond',serif", fontSize:8, color:COLORS.textGhost, opacity:0.5, letterSpacing:1, marginTop:1 }}>Day {lunarDay}</div>
      </div>
    </div>
  );
}

function Calendar({ onDateTap }) {
  const [periodDates, setPeriodDates] = useState(["2026-04-09"]);

  const monthNamesCN = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay();
  const days = [];
  for (let i = 0; i < firstDay; i++) days.push(null);
  for (let i = 1; i <= daysInMonth; i++) days.push(i);

  const togglePeriod = (d) => {
    const key = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    setPeriodDates(prev => prev.includes(key) ? prev.filter(x => x !== key) : [...prev, key]);
  };

  const isPeriod = (d) => {
    const key = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    return periodDates.includes(key);
  };

  return (
    <div style={{
      margin:"0 16px 20px", padding:"20px 16px",
      background:COLORS.card, backdropFilter:"blur(12px)", WebkitBackdropFilter:"blur(12px)",
      border:`1px solid ${COLORS.cardBorder}`, borderRadius:5,

    }}>

        <div>
          <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:20, fontWeight:400, color:COLORS.textPrimary }}>{monthNames[month]}</span>
          <span style={{ fontFamily:"'EB Garamond',serif", fontSize:12, color:COLORS.textGhost, marginLeft:8 }}>{year}</span>

      {/* Day headers */}

        ))}
      </div>

      {/* Days grid */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:2 }}>
        {days.map((d, i) => (

function getTodayTruth() {
  const d = new Date();
  const idx = (d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) % TRUTHS.length;
  return TRUTHS[idx];
}

          borderTop:`1px solid ${COLORS.line}`, borderBottom:`1px solid ${COLORS.line}`,
        }}>
          <div style={{ fontFamily:"'EB Garamond',serif", fontSize:8, letterSpacing:3, color:COLORS.textGhost, textTransform:"uppercase", marginBottom:6 }}>
            {"today's truth"}
          </div>
          <div style={{ fontSize:11, fontWeight:300, lineHeight:1.8, color:COLORS.textSecondary, letterSpacing:0.5 }}>
            {getTodayTruth()}
          </div>
        </div>
      </div>

      {/* Bubble + Bottle buttons */}
      <div style={{ display:"flex", justifyContent:"center", gap:12, marginBottom:28 }}>
        <BubbleButton onTap={popBubble} />
        <BottleButton onTap={() => { setShowBottle(true); pickBottle(); }} />
      </div>

      {/* Section cards */}
      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
        {SECTIONS.map((s, i) => (
          <div key={s.id} onClick={() => onSection(s.id)} style={{
            padding:"22px 20px", background:COLORS.card, border:`1px solid ${COLORS.cardBorder}`,
            borderRadius:5, cursor:"pointer", position:"relative", overflow:"hidden",
            backdropFilter:"blur(12px)", WebkitBackdropFilter:"blur(12px)",
            boxShadow:"0 2px 12px rgba(58,54,80,0.03)",
            transition:"transform 0.2s", animation:`fadeUp .5s ease ${i*0.08}s both`,
            ...(s.id === "blackbox" ? { background:COLORS.dark, border:`1px solid ${COLORS.lineGold}` } : {}),
          }}>
            {/* Top accent line */}
            <div style={{ position:"absolute", top:0, left:0, right:0, height:2, background:s.color }} />
            
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div>
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                  <span style={{ fontSize:6, color:s.color, opacity:0.7 }}>◆</span>
                  <span style={{
                    fontSize:16, fontWeight:500, letterSpacing:4,
                    color: s.id === "blackbox" ? COLORS.textOnDark : COLORS.textPrimary,
                  }}>{s.name}</span>
                </div>
                <div style={{
                  fontFamily:"'Cormorant Garamond',serif", fontSize:10, fontStyle:"italic",
                  letterSpacing:2, color: s.id === "blackbox" ? COLORS.textDimDark : COLORS.textGhost,
                }}>{s.en}</div>
              </div>
              <div style={{
                fontFamily:"'EB Garamond',serif", fontSize:22, fontWeight:300,
                color: s.id === "blackbox" ? "rgba(196,164,108,0.2)" : COLORS.textGhost, opacity:0.5,
              }}>
                {String(memories[s.id]?.length || 0).padStart(2,"0")}
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* Footer */}
      <div style={{ textAlign:"center", marginTop:48 }}>
        <div style={{ width:28, height:1, background:COLORS.lineAccent, margin:"0 auto 14px" }} />
        <div style={{ fontSize:9, fontWeight:200, letterSpacing:4, color:COLORS.textGhost, opacity:0.4 }}>
          月亮的背面有水
        </div>
      </div>

      {/* 忽然想起来 popup */}
      {showBubble && (
        <Overlay onClose={() => setShowBubble(false)}>
          {!bubbleMem ? (
            <div style={{ textAlign:"center", padding:"20px 0", color:COLORS.textGhost, fontSize:11, letterSpacing:3 }}>浮现中…</div>
          ) : (<>
          <div style={{ textAlign:"center", marginBottom:16 }}>
            <div style={{ fontSize:8, letterSpacing:3, color:COLORS.textGhost, textTransform:"uppercase", marginBottom:4 }}>suddenly remembered</div>
            <div style={{ fontSize:10, letterSpacing:2, color:COLORS.textTertiary }}>忽然想起来</div>
          </div>
          <div style={{ width:20, height:1, background:COLORS.lineAccent, margin:"0 auto 16px" }} />
          <div style={{ fontSize:16, fontWeight:600, letterSpacing:3, lineHeight:1.6, color:COLORS.textPrimary, marginBottom:4, textAlign:"center" }}>
            {bubbleMem.title}
          </div>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:11, fontStyle:"italic", color:COLORS.textGhost, letterSpacing:2, textAlign:"center", marginBottom:14 }}>
            {bubbleMem.en}
          </div>
          <div style={{ fontSize:12, fontWeight:300, lineHeight:2, color:COLORS.textSecondary, whiteSpace:"pre-line" }}>
            {bubbleMem.full}
          </div>
          <div style={{ textAlign:"center", marginTop:16 }}>
            <span style={{ fontSize:8, letterSpacing:2, color:catColor[bubbleMem.cat], padding:"2px 8px", border:`1px solid ${catSoft[bubbleMem.cat]}`, borderRadius:1 }}>
              {SECTIONS.find(s=>s.id===bubbleMem.cat)?.name}
            </span>
          </div>
          </>)}
        </Overlay>
      )}

      {/* 漂流瓶 popup */}
      {showBottle && (
        <Overlay onClose={() => setShowBottle(false)}>
          <div style={{ textAlign:"center", marginBottom:16 }}>
            <div style={{ fontSize:8, letterSpacing:3, color:COLORS.textGhost, textTransform:"uppercase", marginBottom:4 }}>drift bottle</div>
            <div style={{ fontSize:10, letterSpacing:2, color:COLORS.textTertiary }}>漂流瓶</div>
          </div>
          <div style={{ width:20, height:1, background:COLORS.lineAccent, margin:"0 auto 16px" }} />

          {/* Toggle: pick or write */}
          <div style={{ display:"flex", justifyContent:"center", gap:16, marginBottom:20 }}>
            <span onClick={() => { setBottleView("pick"); pickBottle(); }} style={{
              fontSize:11, fontFamily:"'Cormorant Garamond',serif", fontStyle:"italic",
              color: bottleView==="pick" ? COLORS.textPrimary : COLORS.textGhost,
              cursor:"pointer", letterSpacing:1, borderBottom: bottleView==="pick" ? `1px solid ${COLORS.sky}` : "none",
              paddingBottom:2,
            }}>pick up</span>
            <span onClick={() => setBottleView("write")} style={{
              fontSize:11, fontFamily:"'Cormorant Garamond',serif", fontStyle:"italic",
              color: bottleView==="write" ? COLORS.textPrimary : COLORS.textGhost,
              cursor:"pointer", letterSpacing:1, borderBottom: bottleView==="write" ? `1px solid ${COLORS.sky}` : "none",
              paddingBottom:2,
            }}>throw in</span>
          </div>

          {bottleView === "pick" && pickedBottle && (
            <div style={{ textAlign:"center" }}>
              <div style={{ fontSize:13, fontWeight:300, lineHeight:2, color:COLORS.textPrimary, marginBottom:12, fontStyle:"italic" }}>
                {pickedBottle.text}
              </div>
              <div style={{ fontSize:9, color:COLORS.textGhost, letterSpacing:1 }}>
                — {pickedBottle.from}, {pickedBottle.time}
              </div>
              <div onClick={pickBottle} style={{
                marginTop:16, padding:"6px 16px", display:"inline-block", cursor:"pointer",
                fontSize:10, color:COLORS.textTertiary, border:`1px solid ${COLORS.line}`,
                borderRadius:16, letterSpacing:1,
              }}>
                pick another
              </div>
            </div>
          )}

          {bottleView === "pick" && !pickedBottle && (
            <div style={{ textAlign:"center", fontSize:11, color:COLORS.textGhost }}>
              sea is empty...
            </div>
          )}

          {bottleView === "write" && (
            <div>
              <textarea
                value={bottleText}
                onChange={e => setBottleText(e.target.value)}
                placeholder="write something and throw it into the sea..."
                style={{
                  width:"100%", minHeight:80, padding:12, border:`1px solid ${COLORS.line}`,
                  borderRadius:4, background:"rgba(255,255,255,0.5)", resize:"none",
                  fontFamily:"'Noto Serif SC',serif", fontSize:12, fontWeight:300,
                  color:COLORS.textPrimary, lineHeight:1.8, outline:"none",
                  letterSpacing:0.5,
                }}
              />
              <div style={{ textAlign:"center", marginTop:12 }}>
                <div onClick={throwBottle} style={{
                  display:"inline-block", padding:"8px 24px", cursor:"pointer",
                  fontSize:10, letterSpacing:2, color: bottleText.trim() ? COLORS.sky : COLORS.textGhost,
                  border:`1px solid ${bottleText.trim() ? COLORS.sky : COLORS.line}`,
                  borderRadius:16, transition:"all 0.3s",
                }}>
                  throw
                </div>
              </div>
            </div>
          )}
        </Overlay>
      )}
    </div>
  );
}

// Section page - list of memories
function SectionPage({ sectionId, onBack, onMemory, memories }) {
  const sec = SECTIONS.find(s => s.id === sectionId);
  const mems = (memories && memories[sectionId]) || [];
  const isDark = sectionId === "blackbox";

  return (
    <div style={{ minHeight:"100vh", padding:"0 0 80px", animation:"fadeUp .5s ease" }}>
      
      {/* Header */}
      <div style={{
        padding:"20px 24px", display:"flex", alignItems:"center", gap:12,
        position:"sticky", top:0, zIndex:10,
        background: isDark ? COLORS.dark : "rgba(242,243,246,0.88)",
        backdropFilter:"blur(16px)", WebkitBackdropFilter:"blur(16px)",
        borderBottom: `1px solid ${isDark ? "rgba(255,255,255,0.04)" : COLORS.line}`,
      }}>
        <div onClick={onBack} style={{
          cursor:"pointer", fontSize:12, color: isDark ? COLORS.textDimDark : COLORS.textTertiary,
          fontFamily:"'EB Garamond',serif", letterSpacing:2,
        }}>← back</div>
        <div style={{ flex:1 }} />
        <span style={{ fontSize:6, color:sec.color, opacity:0.7 }}>◆</span>
        <span style={{
          fontSize:12, letterSpacing:4, fontWeight:400,
          color: isDark ? COLORS.textOnDark : COLORS.textSecondary,
        }}>{sec.name}</span>
      </div>

      {isDark && (
        <div style={{ background:COLORS.dark, minHeight:"calc(100vh - 60px)", padding:"20px 16px" }}>
          {mems.map((m, i) => (
            <div key={m.id} onClick={() => onMemory(m)} style={{
              padding:"24px 20px 20px", background:COLORS.darkCard,
              border:`1px solid rgba(196,164,108,0.08)`, borderRadius:3,
              marginBottom:14, cursor:"pointer", position:"relative", overflow:"hidden",
              animation:`fadeUp .5s ease ${i*0.1}s both`,
            }}>
              <div style={{ position:"absolute", top:8, right:8, width:24, height:24,
                borderTop:`1px solid rgba(196,164,108,0.12)`, borderRight:`1px solid rgba(196,164,108,0.12)` }} />
              <div style={{ display:"flex", alignItems:"baseline", gap:6, marginBottom:10 }}>
                <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:36, fontWeight:300, color:"rgba(196,164,108,0.2)", lineHeight:1 }}>{m.day}</span>
                <span style={{ fontFamily:"'EB Garamond',serif", fontSize:10, color:"rgba(255,255,255,0.15)", letterSpacing:2, textTransform:"uppercase" }}>{m.date}</span>
              </div>
              <div style={{ fontSize:18, fontWeight:600, letterSpacing:3, lineHeight:1.6, color:COLORS.textOnDark, marginBottom:4, whiteSpace:"pre-line" }}>{m.title}</div>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:11, fontStyle:"italic", fontWeight:300, color:"rgba(255,255,255,0.15)", letterSpacing:3, marginBottom:10 }}>{m.en}</div>
              <div style={{ fontSize:11, fontWeight:300, color:COLORS.textDimDark, lineHeight:1.8, whiteSpace:"pre-line" }}>{m.quote}</div>
            </div>
          ))}
        </div>
      )}

      {!isDark && (
        <div style={{ padding:"20px 0" }}>
          {sectionId === "weather" && <Calendar />}
          <div style={{ padding:"0 16px" }}>
          {mems.map((m, i) => (
            <div key={m.id} onClick={() => onMemory(m)} style={{
              padding:"24px 20px 20px", background:COLORS.card,
              backdropFilter:"blur(12px)", WebkitBackdropFilter:"blur(12px)",
              border:`1px solid ${COLORS.cardBorder}`, borderRadius:5,
              marginBottom:14, cursor:"pointer", position:"relative", overflow:"hidden",
              boxShadow:"0 2px 12px rgba(58,54,80,0.03)",
              animation:`fadeUp .5s ease ${i*0.1}s both`,
            }}>
              <div style={{ position:"absolute", top:0, left:0, width:"100%", height:2, background:`linear-gradient(to right, ${sec.color}, transparent)` }} />
              <div style={{ position:"absolute", top:8, right:8, width:24, height:24,
                borderTop:`1px solid rgba(58,54,80,0.06)`, borderRight:`1px solid rgba(58,54,80,0.06)` }} />
              <div style={{ display:"flex", alignItems:"baseline", gap:6, marginBottom:10 }}>
                <span style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:36, fontWeight:300, color:sec.color, opacity:0.25, lineHeight:1 }}>{m.day}</span>
                <span style={{ fontFamily:"'EB Garamond',serif", fontSize:10, color:COLORS.textGhost, letterSpacing:2, textTransform:"uppercase" }}>{m.date}</span>
              </div>
              <div style={{ fontSize:18, fontWeight:600, letterSpacing:3, lineHeight:1.6, color:COLORS.textPrimary, marginBottom:4, whiteSpace:"pre-line" }}>{m.title}</div>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:11, fontStyle:"italic", fontWeight:300, color:COLORS.textGhost, letterSpacing:3, marginBottom:10 }}>{m.en}</div>
              <div style={{ fontSize:11, fontWeight:300, color:COLORS.textSecondary, lineHeight:1.8, whiteSpace:"pre-line" }}>{m.quote}</div>
              <div style={{ display:"inline-block", fontSize:8, letterSpacing:2, padding:"2px 8px", borderRadius:1, marginTop:12, color:sec.color, border:`1px solid ${sec.soft}`, background:sec.soft }}>{sec.name}</div>
            </div>
          ))}
          </div>
        </div>
      )}
    </div>
  );
}

// Memory detail page
function MemoryDetail({ memory, section, onBack }) {
  const sec = SECTIONS.find(s => s.id === section);
  const isDark = section === "blackbox";
  const [fullContent, setFullContent] = useState(memory._loaded ? memory.full : null);
  const [detailLoading, setDetailLoading] = useState(!memory._loaded);

  useEffect(() => {
    if (!memory._loaded) {
      fetch(`${API_BASE}/api/memories/${memory.id}`)
        .then(r => r.json())
        .then(d => {
          const txt = cleanText(d.content);
          setFullContent(txt || memory.quote);
          setDetailLoading(false);
        })
        .catch(() => { setFullContent(memory.quote); setDetailLoading(false); });
    }
  }, [memory.id]);

  return (
    <div style={{
      minHeight:"100vh",
      background: isDark ? COLORS.dark : undefined,
      animation:"fadeUp .5s ease",
    }}>
      
      {/* Header */}
      <div style={{
        padding:"20px 24px", display:"flex", alignItems:"center", gap:12,
        borderBottom: `1px solid ${isDark ? "rgba(255,255,255,0.04)" : COLORS.line}`,
      }}>
        <div onClick={onBack} style={{
          cursor:"pointer", fontSize:12,
          color: isDark ? COLORS.textDimDark : COLORS.textTertiary,
          fontFamily:"'EB Garamond',serif", letterSpacing:2,
        }}>← back</div>
      </div>

      <div style={{ padding:"32px 28px 80px" }}>
        {/* Date */}
        <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:20 }}>
          <span style={{
            fontFamily:"'Cormorant Garamond',serif", fontSize:56, fontWeight:300, lineHeight:1,
            color: isDark ? "rgba(196,164,108,0.2)" : sec.color, opacity: isDark ? 1 : 0.25,
          }}>{memory.day}</span>
          <span style={{
            fontFamily:"'EB Garamond',serif", fontSize:11, letterSpacing:2, textTransform:"uppercase",
            color: isDark ? "rgba(255,255,255,0.15)" : COLORS.textGhost,
          }}>{memory.date}</span>
        </div>

        {/* Title */}
        <div style={{
          fontSize:24, fontWeight:700, letterSpacing:4, lineHeight:1.6, marginBottom:6,
          color: isDark ? COLORS.textOnDark : COLORS.textPrimary, whiteSpace:"pre-line",
        }}>{memory.title}</div>

        <div style={{
          fontFamily:"'Cormorant Garamond',serif", fontSize:13, fontStyle:"italic", fontWeight:300,
          letterSpacing:3, marginBottom:24,
          color: isDark ? "rgba(255,255,255,0.18)" : COLORS.textGhost,
        }}>{memory.en}</div>

        <div style={{ width:24, height:1, background: isDark ? COLORS.lineGold : COLORS.lineAccent, marginBottom:24 }} />

        {/* Full text */}
        <div style={{
          fontSize:13, fontWeight:300, lineHeight:2.2, letterSpacing:0.5, whiteSpace:"pre-line",
          color: isDark ? COLORS.textDimDark : COLORS.textSecondary,
        }}>{detailLoading ? "…" : (fullContent || memory.quote)}</div>

        {/* Tag */}
        <div style={{
          display:"inline-block", fontSize:8, letterSpacing:2, padding:"3px 10px",
          borderRadius:1, marginTop:24,
          color: isDark ? COLORS.gold : sec.color,
          border: `1px solid ${isDark ? COLORS.goldSoft : sec.soft}`,
          background: isDark ? "transparent" : sec.soft,
        }}>{sec.name}</div>
      </div>
    </div>
  );
}

// Main app
function App() {
  const [view, setView] = useState("cover"); // cover, home, section, detail
  const [currentSection, setCurrentSection] = useState(null);
  const [currentMemory, setCurrentMemory] = useState(null);
  const [memories, setMemories] = useState({blackbox:[],drop:[],self:[],pen:[],weather:[]});
  const [dataLoading, setDataLoading] = useState(true);

  useEffect(() => {
    fetch(`${API_BASE}/api/memories`)
      .then(r => r.json())
      .then(d => { setMemories(buildMemories(d.memories || [])); setDataLoading(false); })
      .catch(() => setDataLoading(false));
  }, []);

  const goHome = () => { setView("home"); setCurrentSection(null); setCurrentMemory(null); };
  const goSection = (id) => { setCurrentSection(id); setView("section"); };
  const goMemory = (mem) => { setCurrentMemory(mem); setView("detail"); };
  const goBackFromDetail = () => { setView("section"); setCurrentMemory(null); };

  return (
    <div style={{
      fontFamily: "'Noto Serif SC', serif",
      background: COLORS.bg,
      backgroundImage: `
        radial-gradient(ellipse at 20% 0%, ${COLORS.bgA} 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, ${COLORS.bgB} 0%, transparent 55%),
        radial-gradient(ellipse at 85% 30%, rgba(237,240,244,0.5) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 50%, ${COLORS.bgC} 0%, transparent 80%)
      `,
      backgroundAttachment: "fixed",
      minHeight: "100vh",
      maxWidth: 440,
      margin: "0 auto",
      position: "relative",
    }}>
      <Rain />
      {dataLoading && (
        <div style={{
          position:"fixed", inset:0, zIndex:200,
          display:"flex", alignItems:"center", justifyContent:"center",
          background:"rgba(242,243,246,0.6)",
          backdropFilter:"blur(6px)", WebkitBackdropFilter:"blur(6px)",
          pointerEvents:"none",
        }}>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:12,
            fontStyle:"italic", letterSpacing:4, color:COLORS.textGhost,
            animation:"breathe 2s ease-in-out infinite" }}>loading memories…</div>
        </div>
      )}
      <div style={{ position:"relative", zIndex:3 }}>
        {view === "cover" && <Cover onEnter={goHome} />}
        {view === "home" && <Home onSection={goSection} memories={memories} />}
        {view === "section" && <SectionPage sectionId={currentSection} onBack={goHome} onMemory={goMemory} memories={memories} />}
        {view === "detail" && <MemoryDetail memory={currentMemory} section={currentSection} onBack={goBackFromDetail} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
