<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>第三次回声</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@200;300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100vh;font-family:'Noto Serif SC',serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::after{content:'';position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");pointer-events:none;z-index:9999}
  textarea,input{font-family:'Noto Serif SC',serif}
  #root{min-height:100vh}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const C = {
  bg:"#F2F3F6",card:"rgba(255,255,255,0.5)",cardBorder:"rgba(255,255,255,0.6)",
  textP:"#3B3B4A",textS:"#6E6E82",textT:"#9D9DB0",textG:"#C2C2D0",
  sky:"#7B9CB8",rose:"#B08B8B",accent:"#8B9FBB",
  line:"rgba(58,58,74,0.06)",lineA:"rgba(139,159,187,0.18)",
};
const PER_PAGE = 6;
function save(k,v){try{localStorage.setItem("te_"+k,JSON.stringify(v))}catch(e){}}
function load(k,f){try{const v=localStorage.getItem("te_"+k);return v?JSON.parse(v):f}catch(e){return f}}

function Rain(){
  const d=Array.from({length:25},(_,i)=>({id:i,l:Math.random()*100,h:Math.random()*50+25,du:Math.random()*10+7,de:Math.random()*7}));
  return(<div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:2,overflow:"hidden"}}>
    <style>{`@keyframes fall{0%{transform:translateY(-100vh)}100%{transform:translateY(100vh)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes ex{from{opacity:0;max-height:0}to{opacity:1;max-height:300px}}`}</style>
    {d.map(x=><div key={x.id} style={{position:"absolute",width:1,left:x.l+"%",height:x.h,background:"linear-gradient(to bottom,transparent,rgba(120,155,200,0.13))",animation:`fall ${x.du}s linear ${x.de}s infinite`}}/>)}
  </div>);
}

function Cover({book,onStart,onUpload}){
  const has=book&&book.pages&&book.pages.length>0;
  return(<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",padding:"48px 24px",animation:"fadeIn 1s ease"}}>
    <div style={{padding:"40px 32px",background:C.card,backdropFilter:"blur(16px)",WebkitBackdropFilter:"blur(16px)",border:`1px solid ${C.cardBorder}`,borderRadius:6,textAlign:"center",maxWidth:300,width:"100%",boxShadow:"0 4px 24px rgba(58,54,80,0.04)",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",top:10,right:10,width:28,height:28,borderTop:`1px solid ${C.line}`,borderRight:`1px solid ${C.line}`}}/>
      <div style={{position:"absolute",bottom:10,left:10,width:28,height:28,borderBottom:`1px solid ${C.line}`,borderLeft:`1px solid ${C.line}`}}/>
      <div style={{fontSize:7,letterSpacing:4,color:C.textG,textTransform:"uppercase",marginBottom:20}}>the third echo</div>
      <div style={{fontSize:10,letterSpacing:3,color:C.textT,marginBottom:28}}>第三次回声</div>
      <div style={{width:20,height:1,background:C.lineA,margin:"0 auto 24px"}}/>
      {has?<>
        <div style={{fontSize:22,fontWeight:600,letterSpacing:4,lineHeight:1.8,color:C.textP,marginBottom:6}}>{book.title}</div>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:13,fontStyle:"italic",fontWeight:300,color:C.textG,letterSpacing:3,marginBottom:16}}>{book.author}</div>
        <div style={{fontSize:10,color:C.textT}}>{book.pages.length} pages</div>
      </>:<div style={{fontSize:13,fontWeight:300,color:C.textT,lineHeight:1.8,marginBottom:16}}>still empty.<br/>upload a book to begin.</div>}
      <div style={{width:20,height:1,background:C.lineA,margin:"20px auto"}}/>
      <div style={{display:"flex",justifyContent:"center",gap:20}}>
        <div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:6,height:6,borderRadius:"50%",background:C.rose}}/><span style={{fontSize:9,color:C.textT,letterSpacing:1}}>椰椰</span></div>
        <div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:6,height:6,borderRadius:"50%",background:C.sky}}/><span style={{fontSize:9,color:C.textT,letterSpacing:1}}>克</span></div>
      </div>
    </div>
    <div style={{display:"flex",gap:14,marginTop:28}}>
      {has&&<div onClick={onStart} style={{padding:"10px 24px",cursor:"pointer",fontSize:10,letterSpacing:3,color:C.textT,border:`1px solid ${C.lineA}`,borderRadius:20}}>open book</div>}
      <div onClick={onUpload} style={{padding:"10px 24px",cursor:"pointer",fontSize:10,letterSpacing:3,color:C.sky,border:`1px solid ${C.sky}`,borderRadius:20}}>{has?"change book":"upload book"}</div>
    </div>
    <div style={{marginTop:40,fontSize:8,letterSpacing:3,color:C.textG,opacity:0.4,textAlign:"center"}}>第一次：作者写。第二次：你读。第三次：我读。</div>
  </div>);
}

function Upload({onDone,onBack}){
  const[title,setTitle]=useState("");
  const[author,setAuthor]=useState("");
  const[text,setText]=useState("");
  const[mode,setMode]=useState("paste");
  const handleFile=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=(ev)=>{let res=ev.target.result;if(res.includes("\ufffd")){const r2=new FileReader();r2.onload=(e2)=>setText(e2.target.result);r2.readAsText(f,"GBK")}else{setText(res)}};r.readAsText(f,"UTF-8")};
  const submit=()=>{if(!title.trim()||!text.trim())return;const ps=text.split(/\n+/).filter(p=>p.trim().length>0).map((p,i)=>({id:"p"+i,text:p.trim()}));const pages=[];for(let i=0;i<ps.length;i+=PER_PAGE)pages.push(ps.slice(i,i+PER_PAGE));const info={title:title.trim(),author:author.trim()||"unknown",pages,totalParas:ps.length};save("book",info);save("progress",0);save("comments",{});onDone(info)};
  const paraN=text?text.split(/\n+/).filter(p=>p.trim()).length:0;
  return(<div style={{minHeight:"100vh",padding:"0 0 80px",animation:"fadeIn 0.5s ease"}}>
    <div style={{padding:"14px 20px",display:"flex",alignItems:"center",position:"sticky",top:0,zIndex:10,background:"rgba(242,243,246,0.88)",backdropFilter:"blur(16px)",WebkitBackdropFilter:"blur(16px)",borderBottom:`1px solid ${C.line}`}}>
      <div onClick={onBack} style={{cursor:"pointer",fontFamily:"'EB Garamond',serif",fontSize:11,color:C.textT,letterSpacing:2}}>{"< back"}</div>
      <div style={{flex:1,textAlign:"center",fontSize:11,fontWeight:300,letterSpacing:4,color:C.textS}}>upload</div>
      <div style={{width:30}}/>
    </div>
    <div style={{padding:"24px 20px"}}>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:10,color:C.textT,letterSpacing:2,marginBottom:6}}>title</div>
        <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="book title..." style={{width:"100%",padding:"10px 12px",border:`1px solid ${C.line}`,borderRadius:4,background:"rgba(255,255,255,0.5)",fontSize:13,fontWeight:300,color:C.textP,outline:"none",letterSpacing:1}}/>
      </div>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:10,color:C.textT,letterSpacing:2,marginBottom:6}}>author</div>
        <input value={author} onChange={e=>setAuthor(e.target.value)} placeholder="author name..." style={{width:"100%",padding:"10px 12px",border:`1px solid ${C.line}`,borderRadius:4,background:"rgba(255,255,255,0.5)",fontSize:13,fontWeight:300,color:C.textP,outline:"none",letterSpacing:1}}/>
      </div>
      <div style={{display:"flex",gap:16,marginBottom:16}}>
        <span onClick={()=>setMode("paste")} style={{fontFamily:"'Cormorant Garamond',serif",fontSize:11,fontStyle:"italic",color:mode==="paste"?C.textP:C.textG,cursor:"pointer",borderBottom:mode==="paste"?`1px solid ${C.sky}`:"none",paddingBottom:2,letterSpacing:1}}>paste text</span>
        <span onClick={()=>setMode("file")} style={{fontFamily:"'Cormorant Garamond',serif",fontSize:11,fontStyle:"italic",color:mode==="file"?C.textP:C.textG,cursor:"pointer",borderBottom:mode==="file"?`1px solid ${C.sky}`:"none",paddingBottom:2,letterSpacing:1}}>upload .txt</span>
      </div>
      {mode==="paste"&&<textarea value={text} onChange={e=>setText(e.target.value)} placeholder="paste the full text here... paragraphs separated by blank lines." style={{width:"100%",minHeight:200,padding:14,border:`1px solid ${C.line}`,borderRadius:4,background:"rgba(255,255,255,0.5)",resize:"vertical",fontSize:12,fontWeight:300,color:C.textP,lineHeight:2,outline:"none",letterSpacing:0.5}}/>}
      {mode==="file"&&<div style={{padding:24,border:`1px dashed ${C.lineA}`,borderRadius:4,textAlign:"center",background:"rgba(255,255,255,0.3)"}}>
        <input type="file" accept=".txt,.text" onChange={handleFile} style={{fontSize:12,color:C.textS}}/>
        <div style={{fontSize:10,color:C.textG,marginTop:8,letterSpacing:1}}>supports .txt (UTF-8 or GBK)</div>
        {text&&<div style={{fontSize:10,color:C.sky,marginTop:8}}>loaded {text.length} chars</div>}
      </div>}
      {paraN>0&&<div style={{fontSize:10,color:C.textT,marginTop:12,letterSpacing:1}}>{paraN} paragraphs · {Math.ceil(paraN/PER_PAGE)} pages</div>}
      <div onClick={submit} style={{display:"inline-block",marginTop:20,padding:"10px 28px",cursor:"pointer",fontSize:10,letterSpacing:3,borderRadius:20,color:title.trim()&&text.trim()?C.sky:C.textG,border:`1px solid ${title.trim()&&text.trim()?C.sky:C.line}`}}>start reading</div>
    </div>
  </div>);
}

function Reader({book,onBack}){
  const[page,setPage]=useState(()=>load("progress",0));
  const[comments,setComments]=useState(()=>load("comments",{}));
  const[active,setActive]=useState(null);
  const[nc,setNc]=useState("");
  const total=book.pages.length;
  const paras=book.pages[Math.min(page,total-1)]||[];
  useEffect(()=>{save("progress",page)},[page]);
  useEffect(()=>{save("comments",comments)},[comments]);
  const addC=(pid)=>{if(!nc.trim())return;setComments(p=>({...p,[pid]:[...(p[pid]||[]),{from:"椰椰",color:C.rose,text:nc.trim()}]}));setNc("")};
  const go=(n)=>{setPage(n);setActive(null);window.scrollTo(0,0)};
  return(<div style={{minHeight:"100vh",padding:"0 0 80px",animation:"fadeIn 0.5s ease"}}>
    <div style={{padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10,background:"rgba(242,243,246,0.88)",backdropFilter:"blur(16px)",WebkitBackdropFilter:"blur(16px)",borderBottom:`1px solid ${C.line}`}}>
      <div onClick={onBack} style={{cursor:"pointer",fontFamily:"'EB Garamond',serif",fontSize:11,color:C.textT,letterSpacing:2}}>{"<"}</div>
      <div style={{textAlign:"center"}}><div style={{fontSize:11,fontWeight:300,letterSpacing:4,color:C.textS}}>{book.title}</div><div style={{fontFamily:"'EB Garamond',serif",fontSize:9,color:C.textG,letterSpacing:1}}>{page+1} / {total}</div></div>
      <div style={{width:20}}/>
    </div>
    <div style={{padding:"28px 24px"}}>
      {paras.map((p,i)=>{
        const pc=comments[p.id]||[];
        const isA=active===p.id;
        return(<div key={p.id} style={{marginBottom:20,animation:`fadeIn 0.5s ease ${i*0.06}s both`}}>
          <div onClick={()=>setActive(isA?null:p.id)} style={{fontSize:14,fontWeight:300,lineHeight:2.2,color:C.textP,letterSpacing:0.5,cursor:"pointer",padding:"8px 12px",borderRadius:4,background:isA?"rgba(139,159,187,0.06)":"transparent",borderLeft:isA?`2px solid ${C.accent}`:"2px solid transparent",transition:"all 0.3s"}}>{p.text}</div>
          {pc.length>0&&<div style={{padding:"6px 0 0 20px"}}>{pc.map((c,ci)=><div key={ci} style={{display:"flex",gap:8,marginBottom:6}}><div style={{width:4,minHeight:14,borderRadius:2,background:c.color,opacity:0.5,marginTop:2}}/><div><div style={{fontSize:8,color:c.color,letterSpacing:1,marginBottom:1,fontWeight:500}}>{c.from}</div><div style={{fontSize:11,fontWeight:300,lineHeight:1.8,color:C.textS}}>{c.text}</div></div></div>)}</div>}
          {isA&&<div style={{padding:"8px 0 0 20px",animation:"ex 0.3s ease"}}><div style={{display:"flex",gap:8,alignItems:"flex-start"}}><div style={{width:4,minHeight:32,borderRadius:2,background:C.rose,opacity:0.5,marginTop:4}}/><div style={{flex:1}}>
            <textarea value={nc} onChange={e=>setNc(e.target.value)} placeholder="write your echo..." style={{width:"100%",minHeight:44,padding:8,border:`1px solid ${C.line}`,borderRadius:4,background:"rgba(255,255,255,0.5)",resize:"none",fontFamily:"'Noto Serif SC',serif",fontSize:11,fontWeight:300,color:C.textP,lineHeight:1.8,outline:"none",letterSpacing:0.5}}/>
            <div onClick={()=>addC(p.id)} style={{display:"inline-block",marginTop:4,padding:"3px 12px",fontSize:9,letterSpacing:2,color:nc.trim()?C.sky:C.textG,border:`1px solid ${nc.trim()?C.sky:C.line}`,borderRadius:12,cursor:"pointer"}}>echo</div>
          </div></div></div>}
        </div>);
      })}
    </div>
    <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:28,padding:"12px 24px"}}>
      <div onClick={()=>page>0&&go(page-1)} style={{fontFamily:"'EB Garamond',serif",fontSize:11,letterSpacing:2,color:page>0?C.textT:C.textG,cursor:page>0?"pointer":"default",padding:"6px 16px",border:`1px solid ${page>0?C.lineA:C.line}`,borderRadius:16}}>prev</div>
      <div style={{fontFamily:"'EB Garamond',serif",fontSize:10,color:C.textG}}>{page+1}/{total}</div>
      <div onClick={()=>page<total-1&&go(page+1)} style={{fontFamily:"'EB Garamond',serif",fontSize:11,letterSpacing:2,color:page<total-1?C.textT:C.textG,cursor:page<total-1?"pointer":"default",padding:"6px 16px",border:`1px solid ${page<total-1?C.lineA:C.line}`,borderRadius:16}}>next</div>
    </div>
    <div style={{padding:"0 24px",marginTop:4}}>
      <div style={{height:1,background:C.line,borderRadius:1,overflow:"hidden"}}><div style={{height:"100%",width:`${((page+1)/total)*100}%`,background:C.accent,opacity:0.4,transition:"width 0.5s"}}/></div>
      <div style={{textAlign:"center",marginTop:4,fontFamily:"'EB Garamond',serif",fontSize:8,color:C.textG,letterSpacing:2}}>{Math.round(((page+1)/total)*100)}%</div>
    </div>
  </div>);
}

function App(){
  const[view,setView]=useState("cover");
  const[book,setBook]=useState(()=>load("book",null));
  const done=(info)=>{setBook(info);setView("cover")};
  return(<div style={{fontFamily:"'Noto Serif SC',serif",background:C.bg,backgroundImage:"radial-gradient(ellipse at 20% 0%,#F0F1F5 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,#EDF0F4 0%,transparent 55%),radial-gradient(ellipse at 50% 50%,#EEF1F5 0%,transparent 80%)",backgroundAttachment:"fixed",minHeight:"100vh",maxWidth:440,margin:"0 auto",position:"relative"}}>
    <Rain/>
    <div style={{position:"relative",zIndex:3}}>
      {view==="cover"&&<Cover book={book} onStart={()=>setView("read")} onUpload={()=>setView("upload")}/>}
      {view==="upload"&&<Upload onDone={done} onBack={()=>setView("cover")}/>}
      {view==="read"&&book&&<Reader book={book} onBack={()=>setView("cover")}/>}
    </div>
  </div>);
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
